plugins {
    id "com.android.application"
    id "com.google.gms.google-services" // FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Must be applied last
}

android {
    namespace = "com.angerasilas.bmi_calculator"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.angerasilas.bmi_calculator"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 3
        versionName = flutter.versionName
        minSdkVersion 23
    }

    signingConfigs {
        release {
            storeFile file('bmicalc-release-key.jks') // Path to the keystore
            storePassword '@Prof#001'               // Keystore password
            keyAlias 'bmicalc'                       // Key alias
            keyPassword '@Prof#001'                 // Key password
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false // Set true to enable code shrinking with ProGuard
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

# Force Gradle to use Java 21 (Gradle 8.x does not support Java 25)
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
# JVM arguments for Gradle (good as-is)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# AndroidX (required)
android.useAndroidX=true
android.enableJetifier=true
# byte-buddy-1.18.2 is compiled with Java 24 (class file version 68); Jetifier
# cannot transform it. Exclude it — it is a test-time mock library and doesn't
# need AndroidX migration.
android.jetifier.ignorelist=byte-buddy
# Suppress warning for compileSdk 34 (safe)
android.suppressUnsupportedCompileSdk=34
# Performance tweaks (good)
org.gradle.parallel=true
org.gradle.configureondemand=true
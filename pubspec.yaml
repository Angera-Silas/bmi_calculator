name: bmi_calculator
description: "A new Flutter that focuses on widgets customization."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.2
  firebase_data_connect: ^0.1.3
  firebase_core: any
  shared_preferences: ^2.5.1
  animated_text_kit: ^4.2.3
  firebase_crashlytics: ^4.3.2
  firebase_analytics: ^11.4.2
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - images/logo.png

  fonts:
    - family: Pacifico
      fonts:
        - asset: fonts/Pacifico-Regular.ttf

    - family: Source Sans Pro
      fonts:
        - asset: fonts/SourceSansPro-Regular.ttf
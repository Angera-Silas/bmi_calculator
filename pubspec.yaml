name: bmi_calculator
description: "A new Flutter that focuses on widgets customization."
publish_to: 'Google Play Store'
version: 2.0.0+2

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_data_connect: ^0.2.4
  firebase_core: any
  shared_preferences: ^2.5.1
  animated_text_kit: ^4.2.3
  firebase_crashlytics: ^5.1.0
  firebase_analytics: ^12.2.0
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^7.1.1
  uuid: ^4.5.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^7.0.0
  otp: ^3.0.0
  flutter_web_auth_2: ^3.0.0
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  generate: true
  uses-material-design: true

  assets:
    - images/logo.png

  fonts:
    - family: Pacifico
      fonts:
        - asset: fonts/Pacifico-Regular.ttf

    - family: Source Sans Pro
      fonts:
        - asset: fonts/SourceSansPro-Regular.ttf